# Every pull request: the same checks as ./scripts/check.sh, a secret scan, and the catalog site
# (unit tests, build, no-JS fallback, Atom feed, Playwright smoke). docs/SITE-SPEC.md test plan.
name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version COMPATIBILITY.md says the plugins are tested on. Bump both together.
  CLAUDE_CODE_VERSION: 2.1.301

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags: build-index reads COMPATIBILITY.md at each release tag
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Claude Code CLI
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: check.sh (validate --strict, manifests, portability, unit tests, index)
        run: ./scripts/check.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --verbose

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build (index, typecheck, bundle)
        run: npm run build
      - name: No-JS fallback lists every plugin (AC-12)
        run: node ../scripts/ci/check-static-catalog.mjs dist/index.html
      - name: Atom feed is well-formed Atom 1.0 (AC-9)
        run: python3 ../scripts/ci/check-atom.py dist/feed.xml
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke (AC-2, AC-3, AC-4, AC-5, AC-7, AC-8, AC-15)
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: site/test-results
          retention-days: 7
